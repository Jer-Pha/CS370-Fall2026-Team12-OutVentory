{% extends 'base.html' %}

{% block content %}
  <h2>{{ page_title }}</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
    <a href="{% url 'item_list' %}">Cancel</a>
  </form>

  {% if object.pk %}
    <p>
      <a href="{% url 'item_delete' object.pk %}" style="color: red;">Delete</a>
    </p>
  {% endif %}
{% endblock %}
