{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title -->
    <title>
      {% if page_title %}
        {{ page_title }}
      {% else %}
        {% block title %}

        {% endblock %}
      {% endif %}| OutVentory
    </title>

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      {% include 'core/partials/site_header.html' %}
    </header>

    <!-- Main content -->
    <main>
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
