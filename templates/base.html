<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title -->
    <title>
      {% if page_title %}
        {{ page_title }}
      {% else %}
        {% block title %}

        {% endblock %}
      {% endif %}| OutVentory
    </title>
  </head>
  <body>
    <!-- Header -->
    <header>
      {% if request.path != '/login/' and 'signup' not in request.path %}
        {% if user.is_authenticated %}
          <p>Hi {{ user.profile.name }} from {{ user.profile.company.name }}</p>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log Out</button>
          </form>
        {% else %}
          <p>You are not logged in</p>
          <p>
            <a href="{% url 'login' %}">Log In</a>
          </p>
          <p>
            <a href="{% url 'signup' %}">Sign Up</a>
          </p>
        {% endif %}
      {% endif %}
    </header>

    <!-- Main content -->
    <main>
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
